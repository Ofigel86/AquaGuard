# AquaGuard 1.0.0
# Пороги подобраны с запасом. Экспериментальные чеки выключены, пока их явно не включат в toggles.yml.
# Живые переключатели (penalties/setback из GUI) пишутся в settings.yml и перекрывают этот файл.

config-version: 4

alerts-permission: "ag.alerts"
silent-mode: true
decay-per-minute: 0.5
verbose-console: false

alerts:
  console: true
  sound: true
  cooldown-ms: 1500

log:
  enabled: true

history:
  global: 300
  per-player: 40

webhook:
  enabled: false
  url: ""
  min-vl: 4
  cooldown-ms: 2500
  color: 16744272

gates:
  cancel-sensitive-checks: true
  max-ping-ms: 320
  min-tps: 17.5
  join-grace-ms: 2000
  teleport-grace-ms: 900

exempt-worlds: []
respect-bypass-permission: true

bedrock:
  speed-extra: 0.08
  reach-extra: 0.35

owner:
  uuids: []
  auto-claim:
    enabled: false
    name: ""
    require-online-mode: true
  default-bypass: false

penalties:
  mode: "simulate"          # off | simulate | soft | hard
  pvp-only: true
  soft-scale: 0.75
  hard-scale: 0.15
  min-total-vl-soft: 12
  min-total-vl-hard: 24
  max-ping-ms: 250

setback:
  enabled: true
  max-ping-ms: 280
  cooldown-ms: 400

freeze:
  allow-chat: true
  alert-on-quit: true

checks-toggles:
  enabled-by-default: true
  map: {}

bypass:
  default-expire-mins: 1440
  codes: []

# Старый per-check кик. 0 = выключен. Новая лестница — punishments ниже, по умолчанию тоже выключена.
legacy-punish:
  reason: "Kicked by AquaGuard (%check%)"

punishments:
  enabled: false
  mode: log                    # log | execute
  min-interval-ms: 4000
  ladder:
    - min-total-vl: 25
      commands:
        - "kick %player% AquaGuard %check% VL %vl%"
    - min-total-vl: 45
      commands:
        - "ban %player% AquaGuard %check% VL %vl%"

